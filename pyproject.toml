[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarmark"
version = "2.1.0"
description = "High-precision scientific PDF to Markdown converter with LaTeX math, table recovery, figure extraction, and RAG grounding manifest."
readme = "README.md"
authors = [
    { name = "ScholarMark Team" }
]
license = { text = "MIT" }
keywords = ["pdf-converter", "markdown", "academic-papers", "latex", "rag", "llm-grounding", "ocr", "scientific-papers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "pymupdf4llm>=1.24.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
deep = [
    "onnxruntime>=1.17.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
scholarmark = "scholarmark.cli:main"

[project.urls]
Homepage = "https://github.com/joako-baneado/scholarmark"
Repository = "https://github.com/joako-baneado/scholarmark"
Issues = "https://github.com/joako-baneado/scholarmark/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scholarmark*"]
